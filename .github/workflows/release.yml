name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Resolve workspace
        run: dart pub get
      - name: Generate Drift database
        working-directory: packages/miaonotes_core
        run: dart run build_runner build
      - name: Verify generated database is current
        run: git diff --exit-code -- packages/miaonotes_core/lib/src/database/database.g.dart
      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          packages/miaonotes_core tools/sync_simulator
      - name: Analyze
        run: |
          dart analyze packages/miaonotes_core
          dart analyze tools/sync_simulator
      - name: Test core
        working-directory: packages/miaonotes_core
        run: dart test
      - name: Test simulator
        working-directory: tools/sync_simulator
        run: dart test
      - name: Run simulator release gate
        working-directory: tools/sync_simulator
        run: dart run bin/sync_simulator.dart
      - name: Run persistence performance gate
        working-directory: packages/miaonotes_core
        run: dart run benchmark/persistence_benchmark.dart

  windows-release:
    needs: verify-core
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
      - name: Validate tag and application version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use the exact vMAJOR.MINOR.PATCH form: $tag"
          }

          $pubspec = Get-Content 'apps/windows/pubspec.yaml' -Raw
          $match = [regex]::Match(
            $pubspec,
            '(?m)^version:\s*(\d+\.\d+\.\d+)(?:\+\d+)?\s*$'
          )
          if (-not $match.Success) {
            throw 'Unable to read the application version from pubspec.yaml.'
          }

          $tagVersion = $tag.Substring(1)
          $appVersion = $match.Groups[1].Value
          if ($tagVersion -ne $appVersion) {
            throw "Tag $tag does not match application version $appVersion."
          }
      - name: Resolve Windows application
        working-directory: apps/windows
        run: flutter pub get
      - name: Check Windows formatting
        working-directory: apps/windows
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Windows application
        working-directory: apps/windows
        run: flutter analyze
      - name: Test Windows application
        working-directory: apps/windows
        run: flutter test
      - name: Build Windows release
        working-directory: apps/windows
        run: flutter build windows --release
      - name: Package release assets
        id: package_release
        working-directory: apps/windows
        shell: pwsh
        run: |
          $dist = 'dist'
          $archive = "$dist/MiaoNotes-$env:GITHUB_REF_NAME-windows-x64-portable.zip"
          $checksum = "$archive.sha256"
          $releaseDirectory = 'build/windows/x64/runner/Release'

          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          foreach ($requiredPath in @('miaonotes.exe', 'flutter_windows.dll', 'data')) {
            if (-not (Test-Path (Join-Path $releaseDirectory $requiredPath))) {
              throw "Windows release is incomplete: $requiredPath is missing."
            }
          }
          Compress-Archive `
            -Path "$releaseDirectory/*" `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" |
            Set-Content -Path $checksum -Encoding ascii

          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiaoNotes-${{ github.ref_name }}-windows-x64
          path: |
            apps/windows/${{ steps.package_release.outputs.archive }}
            apps/windows/${{ steps.package_release.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: apps/windows/${{ steps.package_release.outputs.archive }}
          CHECKSUM: apps/windows/${{ steps.package_release.outputs.checksum }}
        shell: pwsh
        run: |
          $releaseArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            $env:ARCHIVE, $env:CHECKSUM,
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag',
            '--generate-notes',
            '--title', "MiaoNotes $env:GITHUB_REF_NAME"
          )
          if ($env:GITHUB_REF_NAME.StartsWith('v0.')) {
            $releaseArgs += '--prerelease'
          }
          & gh @releaseArgs
