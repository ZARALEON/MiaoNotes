name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve workspace
        run: dart pub get
      - name: Generate Drift database
        working-directory: packages/miaonotes_core
        run: dart run build_runner build
      - name: Verify generated database is current
        run: git diff --exit-code -- packages/miaonotes_core/lib/src/database/database.g.dart
      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          packages/miaonotes_core tools/sync_simulator
      - name: Analyze
        run: |
          dart analyze packages/miaonotes_core
          dart analyze tools/sync_simulator
      - name: Test core
        working-directory: packages/miaonotes_core
        run: dart test
      - name: Test simulator
        working-directory: tools/sync_simulator
        run: dart test
      - name: Run simulator release gate
        working-directory: tools/sync_simulator
        run: dart run bin/sync_simulator.dart
      - name: Run persistence performance gate
        working-directory: packages/miaonotes_core
        run: dart run benchmark/persistence_benchmark.dart

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Windows application
        working-directory: apps/windows
        run: flutter pub get
      - name: Check Windows formatting
        working-directory: apps/windows
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Windows application
        working-directory: apps/windows
        run: flutter analyze
      - name: Test Windows application
        working-directory: apps/windows
        run: flutter test
      - name: Build Windows release
        working-directory: apps/windows
        run: flutter build windows --release
