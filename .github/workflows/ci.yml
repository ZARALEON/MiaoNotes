name: core-ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - name: Resolve workspace
        run: dart pub get
      - name: Generate Drift database
        working-directory: packages/miaonotes_core
        run: dart run build_runner build
      - name: Verify generated database is current
        run: git diff --exit-code -- packages/miaonotes_core/lib/src/database/database.g.dart
      - name: Check formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          packages/miaonotes_core tools/sync_simulator
      - name: Analyze
        run: |
          dart analyze packages/miaonotes_core
          dart analyze tools/sync_simulator
      - name: Test core
        working-directory: packages/miaonotes_core
        run: dart test
      - name: Test simulator
        working-directory: tools/sync_simulator
        run: dart test
      - name: Run simulator release gate
        working-directory: tools/sync_simulator
        run: dart run bin/sync_simulator.dart
      - name: Run persistence performance gate
        working-directory: packages/miaonotes_core
        run: dart run benchmark/persistence_benchmark.dart

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          cache: true
      - name: Resolve Windows application
        working-directory: apps/windows
        run: flutter pub get
      - name: Check Windows formatting
        working-directory: apps/windows
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Windows application
        working-directory: apps/windows
        run: flutter analyze
      - name: Test Windows application
        working-directory: apps/windows
        run: flutter test
      - name: Build Windows release
        working-directory: apps/windows
        run: flutter build windows --release
      - name: Smoke-test Windows release
        shell: pwsh
        run: >-
          & .github/scripts/windows-release-smoke.ps1
          -ReleaseDirectory apps/windows/build/windows/x64/runner/Release
      - name: Package Windows snapshot
        if: github.event_name != 'pull_request'
        id: package_snapshot
        working-directory: apps/windows
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 12)
          $dist = 'dist'
          $archive = "$dist/MiaoNotes-main-$shortSha-windows-x64-portable.zip"
          $checksum = "$archive.sha256"
          $releaseDirectory = 'build/windows/x64/runner/Release'

          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          foreach ($requiredPath in @('miaonotes.exe', 'flutter_windows.dll', 'data')) {
            if (-not (Test-Path (Join-Path $releaseDirectory $requiredPath))) {
              throw "Windows release is incomplete: $requiredPath is missing."
            }
          }
          Compress-Archive `
            -Path "$releaseDirectory/*" `
            -DestinationPath $archive `
            -CompressionLevel Optimal

          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($archive))" |
            Set-Content -Path $checksum -Encoding ascii

          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT
      - name: Upload Windows snapshot
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: MiaoNotes-windows-x64-${{ github.sha }}
          path: |
            apps/windows/${{ steps.package_snapshot.outputs.archive }}
            apps/windows/${{ steps.package_snapshot.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7
